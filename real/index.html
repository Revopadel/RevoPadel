<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080C12">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revo Real">
<title>Revo Pádel · versión conectada</title>
<link rel="stylesheet" href="../web/fonts/fonts.css">
<style>
/* Versión conectada a Supabase. Mismo aspecto "Pista nocturna" que la demo. */
:root{
  --bg:#080C12;--surface:#111823;--surface2:#1A2331;--ink:#EEF2F7;--muted:#97A3B6;--line:#243042;
  --accent:#5B8CFF;--lime:#D4F04A;--lime-ink:#0A0F05;--hero:#0D1A30;--bad:#FF7A7A;--ok:#4ADE80;--warn:#FCD34D;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;--font-b:'Barlow','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px}
.logo{display:block;color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#14223D;color:var(--accent)}
.tag.lime{background:#22300A;color:var(--lime)}
.tag.warn{background:#332708;color:var(--warn)}
/* ===== Pantallas grandes (ordenador, tablet en horizontal) ===== */
.courts,.cardgrid{display:block}
@media (min-width:900px){
  html body #app{max-width:1240px;padding:0 36px 48px 132px}
  html body .tabs{top:0;bottom:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:22px 8px}
  html body .tabs div{flex-direction:column;gap:6px;max-width:none}
  html body .tabs button{flex:none;padding:12px 4px;font-size:12px}
  html body .tabs button.on{background:#141D2B}
  html body .sheet-bg{align-items:center}
  html body .sheet{border-radius:20px;max-width:560px;max-height:86vh;border:1px solid var(--line)}
  html body .toast{bottom:28px}
  .courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:6px}
  .courts .card{margin:0}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:8px}
  .cardgrid .card{margin:0;height:100%}
  html body .days{flex-wrap:wrap}
}
.clubhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px}
.clubwide{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.clubside .card:first-child{margin-top:0}
.kpi b{display:block;font-family:var(--font-d);font-size:34px;line-height:1}
.kpi b small{font-size:18px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.board{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.board table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px}
.board thead th{position:sticky;top:0;background:#0F1621;z-index:1;padding:12px 8px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
.board thead th small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:2px}
.board th.bh{width:74px;text-align:left;padding:8px 10px;font-size:14px;vertical-align:top;border-right:1px solid var(--line)}
.board tbody th.bh small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.board td.bc{padding:4px;height:64px;vertical-align:stretch;border-bottom:1px solid #1A2331}
.board tbody tr:last-child td,.board tbody tr:last-child th{border-bottom:0}
.bk{display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;height:100%;min-height:56px;border-radius:10px;padding:6px 10px;text-align:left;border:1px solid transparent;color:var(--ink);background:transparent;font:inherit;cursor:pointer;overflow:hidden}
div.bk{cursor:default}
.bk b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc.app .bk{background:#14254A;border-color:#2E4A8C}
.bc.app.pend .bk{background:#2C2410;border-color:#6B5414}
.bc.tel .bk{background:#1E2A0C;border-color:#4C5E14}
.bc.blk .bk{background:repeating-linear-gradient(135deg,#1A2230,#1A2230 8px,#151C27 8px,#151C27 16px);border-color:#2A3445}
.bc.was .bk{opacity:.5}
.bk:hover{filter:brightness(1.18)}
.bc.past{background:repeating-linear-gradient(135deg,transparent,transparent 6px,rgba(255,255,255,.02) 6px,rgba(255,255,255,.02) 12px)}
.bfree{display:flex;gap:4px;height:100%;min-height:56px;position:relative}
.bfree button{opacity:0;transition:opacity .12s}
.bfree::before{content:'Libre';position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-size:12px;color:#3E4C60;font-weight:600;pointer-events:none;transition:opacity .12s}
.bc.free:hover .bfree button,.bfree:focus-within button{opacity:1}
.bc.free:hover .bfree::before,.bfree:focus-within::before{opacity:0}
@media (hover:none){.bfree button{opacity:1}.bfree::before{display:none}}
.bfree button{flex:1;border:1px dashed #3A4A5E;background:transparent;color:var(--muted);border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer}
.bfree button:first-child{color:var(--lime);border-color:#55631F}
.bfree button:hover{background:#141D2B}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 2px 0}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:-8px;vertical-align:-1px;border:1px solid transparent}
.lg.app{background:#14254A;border-color:#2E4A8C}.lg.pend{background:#2C2410;border-color:#6B5414}.lg.tel{background:#1E2A0C;border-color:#4C5E14}.lg.blk{background:#1A2230;border-color:#2A3445}.lg.free{border:1px dashed #55631F}
/* ===== Animaciones ===== */
.btn,.slot,.day,.card,.tabs button,.bk,.hr{transition:transform .14s ease,filter .14s ease,background .2s,border-color .2s,color .2s}
.btn:active,.slot:active,.day:active,.tabs button:active,button.card:active{transform:scale(.965)}
.confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  @keyframes sheetin{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes tabpop{0%{transform:scale(1)}40%{transform:scale(1.22) translateY(-2px)}100%{transform:scale(1)}}
  @keyframes urge{50%{transform:scale(1.06);color:#FFB347}}
  @keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
  #app.enter .card,#app.enter .board,#app.enter .empty-state,#app.enter .kpi,#app.enter .cardgrid>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
  #app.enter .card:nth-of-type(2),#app.enter .cardgrid>*:nth-child(2){animation-delay:.05s}
  #app.enter .card:nth-of-type(3),#app.enter .cardgrid>*:nth-child(3){animation-delay:.1s}
  #app.enter .card:nth-of-type(4),#app.enter .cardgrid>*:nth-child(4){animation-delay:.15s}
  #app.enter .card:nth-of-type(n+5),#app.enter .cardgrid>*:nth-child(n+5){animation-delay:.2s}
  #app.enter .slot{animation:pop .32s cubic-bezier(.2,.8,.3,1.2) both}
  #app.enter .slot:nth-child(3n+2){animation-delay:.03s}
  #app.enter .slot:nth-child(3n){animation-delay:.06s}
  #app.enter .slot:nth-child(n+4){animation-delay:.09s}
  #app.enter .slot:nth-child(n+7){animation-delay:.13s}
  #app.enter .board tbody tr{animation:fadein .4s both}
  .sheet-bg.opening{animation:fadein .2s ease both}
  .sheet-bg.opening .sheet{animation:sheetup .34s cubic-bezier(.2,.85,.25,1) both}
  .toast.pop{animation:toastin .3s cubic-bezier(.2,.8,.3,1.2) both}
  .tabs button.on svg{animation:tabpop .4s ease}
  .cd.urg{display:inline-block;animation:urge 1s ease-in-out infinite}
  .slot.free:hover,.slot.open:hover{transform:translateY(-2px);filter:brightness(1.15)}
  html body .btn:not(.btn-line):not(.btn-danger):not(:disabled){background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:200% 100%;background-repeat:no-repeat;background-position:-200% 0}
  html body .btn:not(.btn-line):not(.btn-danger):not(:disabled):hover{animation:shine .9s ease}
  html body .pushcard .btn{animation:shine 2.6s ease 1.2s 2}
  .spin{animation-duration:.7s}
}
@media (prefers-reduced-motion:no-preference) and (min-width:900px){
  html body .sheet-bg.opening .sheet{animation:sheetin .28s cubic-bezier(.2,.85,.25,1) both}
}

/* ===== Más movimiento ===== */
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0)}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:36vh;color:var(--muted);font-size:13px}
.loader .ballw{position:relative;width:46px;height:70px}
.loader svg{position:absolute;left:3px;top:0;width:40px;height:40px}
.loader i{position:absolute;left:8px;bottom:0;width:30px;height:6px;border-radius:50%;background:rgba(212,240,74,.25)}
.sheet{overscroll-behavior:contain}
.sheet .grab{display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
@media (min-width:900px){.sheet .grab{display:none}}
.tabs button{position:relative}
@media (prefers-reduced-motion:no-preference){
  @keyframes ripple{to{transform:scale(1);opacity:0}}
  @keyframes bounce{0%,100%{transform:translateY(30px) scale(1.08,.92)}50%{transform:translateY(0) rotate(180deg)}}
  @keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.4}}
  @keyframes sheetdown{to{transform:translateY(100%)}}
  @keyframes sheetout{to{opacity:0;transform:translateY(14px) scale(.97)}}
  @keyframes fadeout{to{opacity:0}}
  @keyframes breathe{50%{box-shadow:0 0 0 3px rgba(91,140,255,.18),0 0 16px rgba(91,140,255,.25)}}
  @keyframes seat{50%{border-color:var(--accent);color:var(--ink)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes dotin{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
  @keyframes daypick{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes tagpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .rip{animation:ripple .55s ease-out forwards}
  .loader svg{animation:bounce .8s cubic-bezier(.5,0,.5,1) infinite}
  .loader i{animation:shadow .8s cubic-bezier(.5,0,.5,1) infinite}
  .sheet-bg.closing{animation:fadeout .2s ease forwards;pointer-events:none}
  .sheet-bg.closing .sheet{animation:sheetdown .22s cubic-bezier(.4,0,1,1) forwards}
  .slot.open{animation:breathe 2.4s ease-in-out infinite}
  .pl.empty{animation:seat 2s ease-in-out infinite}
  #app.enter .bar i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) .2s both}
  .tabs button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--lime);animation:dotin .3s cubic-bezier(.2,1.6,.4,1) both}
  .day.on.picked{animation:daypick .35s ease}
  #app.enter .tag{animation:tagpop .35s cubic-bezier(.2,1.5,.4,1) .25s both}
  @media (hover:hover){button.card:hover,.courts .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.35)}}
}
@media (prefers-reduced-motion:no-preference) and (min-width:900px){
  html body .sheet-bg.closing .sheet{animation:sheetout .18s ease forwards}
  html body .tabs button.on::after{left:6px;top:50%;bottom:auto;transform:translateY(-50%);animation:none}
}
.lvlhint{margin-top:8px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.45}
.lvlhint b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:6px 0 0;cursor:pointer;text-align:left}
.lvrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.lvrow.on{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.lvnum{font-family:var(--font-d);font-weight:800;font-size:20px;line-height:1.1;color:var(--lime);min-width:76px;white-space:nowrap}
.quiz h2{margin:0}
.quiz .qq{font-size:24px;line-height:1.15;margin:14px 0 14px}
.qball{display:flex;justify-content:center;margin:4px 0 10px}
.qbar{height:6px;border-radius:99px;background:var(--surface2);margin-top:10px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s ease}
.qopt{width:100%;text-align:left;color:inherit;font:inherit;font-weight:600;padding:14px 16px;cursor:pointer}
.qopt.on{border-color:var(--lime);background:rgba(212,240,74,.10);color:var(--lime)}
.qres{font-family:var(--font-d);font-weight:800;font-size:88px;line-height:.95;color:var(--lime);margin-top:4px}
.qadj{justify-content:space-between;align-items:center;gap:8px}
.qadj .btn{min-width:72px}
@media (prefers-reduced-motion:no-preference){
  @keyframes qin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @keyframes qpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .quiz .qq,.quiz .list{animation:qin .28s ease both}
  .qres{animation:qpop .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes qhop{0%,100%{transform:none}40%{transform:translateY(-14px) rotate(160deg)}}
  .qball svg{animation:qhop .8s cubic-bezier(.3,0,.4,1) .2s 2}
}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45;cursor:pointer}
.terms input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--lime)}
.terms a,.legal a{color:var(--ink)}
.legal{text-align:center;color:var(--muted);margin:16px 0 0}
.legal a{color:var(--muted)}
.fixtag{background:#1F2A44;color:var(--accent);font-size:10px;padding:2px 6px;margin-left:4px;vertical-align:1px}
.pushcard{border-color:#3B4A12;background:linear-gradient(180deg,rgba(212,240,74,.07),transparent)}
.contact{display:flex;flex-direction:column;gap:12px}
.contact a.btn{text-decoration:none}
.caja{display:flex;flex-direction:column;gap:8px}
.cajagrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cajagrid>div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--surface2)}
.cajagrid b{font-family:var(--font-d);font-size:24px}
.cdtag{background:#14223D;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.cdbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25)}
.cdbox span{font-size:13px;opacity:.85}.cdbox b{font-size:22px;font-variant-numeric:tabular-nums}
.cd.urg{color:var(--warn)}
h1,h2,h3{font-family:var(--font-d);font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin:0}
h1{font-size:30px;line-height:1}
h2{font-size:22px}
h3{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--lime);color:var(--lime-ink)}
.btn:disabled{opacity:.5}
.btn-line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-blue{background:var(--accent);color:#06101F}
.btn-danger{background:#3A1214;color:var(--bad);border:1px solid #5A2226}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:center;min-width:62px}
.day b{display:block;font-family:var(--font-d);font-size:20px}
.day span{font-size:12px;color:var(--muted);text-transform:capitalize}
.day.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.day.on span{color:var(--lime-ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 4px;text-align:center;font-weight:700}
.slot small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.slot.free{border-color:#55631F;color:var(--lime)}
.slot.open{border-color:#2E4A8C;color:var(--accent)}
.slot.taken,.slot.past{opacity:.45}
.slot.mine{border-color:var(--ok);color:var(--ok)}
.list{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface2);border-radius:10px}
.pl.empty{color:var(--muted);border:1px dashed var(--line);background:transparent}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0B1119;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:flex;max-width:480px;width:100%}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:12px;font-weight:700;border-radius:10px}
.tabs button.on{color:var(--lime)}
.tabs svg{display:block;margin:0 auto 2px;width:22px;height:22px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;padding:4px 0}
.msg{background:var(--surface2);border-radius:12px;padding:8px 10px;max-width:85%}
.msg.me{align-self:flex-end;background:#1C2B4F}
.msg b{font-size:12px;color:var(--accent);display:block}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90%;text-align:center}
.toast.bad{background:var(--bad);color:#2A0606}
.center{text-align:center}
.paychoice{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.paychoice legend{font-weight:700;margin-bottom:8px}

var IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent),IS_STANDALONE=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
async function pushState(){if(!pushSupported())return IS_IOS&&!IS_STANDALONE?'ios':'no';
  if(Notification.permission==='denied')return 'denied';
  try{var reg=await navigator.serviceWorker.ready;var sub=await reg.pushManager.getSubscription();return sub?'on':'off';}catch(e){return 'off';}}
function b64u(b){var p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function refreshPush(){S.push=await pushState();if(S.tab==='perfil'||S.tab==='mias')render();
  // si el móvil ya tenía avisos, se vinculan a la cuenta con la que se ha entrado
  if(S.push==='on'){try{var reg=await navigator.serviceWorker.ready;var sub=await reg.pushManager.getSubscription();if(sub)await fx('push-alta',{action:'alta',subscription:sub.toJSON()});}catch(e){}}}
async function pushOn(){S.busy=true;render();
  try{var perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Sin permiso no podemos avisarte. Puedes darlo en los ajustes del navegador.',true);}
    else{var reg=await navigator.serviceWorker.ready;var k=await fx('push-alta',{action:'clave'});
      var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.publicKey)});
      await fx('push-alta',{action:'alta',subscription:sub.toJSON()});
      var t=await fx('push-alta',{action:'prueba'});toast(t&&t.enviadas?'¡Avisos activados! Te hemos mandado uno de prueba':'Avisos activados');}}
  catch(e){toast(errMsg(e),true);}
  S.busy=false;S.push=await pushState();render();}
async function pushOff(){S.busy=true;render();
  try{var reg=await navigator.serviceWorker.ready;var sub=await reg.pushManager.getSubscription();
    if(sub){await fx('push-alta',{action:'baja',endpoint:sub.endpoint}).catch(function(){});await sub.unsubscribe();}toast('Avisos desactivados');}
  catch(e){toast(errMsg(e),true);}
  S.busy=false;S.push=await pushState();render();}

  if(!S.match){try{var inf=await q(sb.rpc('booking_by_link',{p_booking:id}));
      if(inf&&inf.length){S.sheet={type:'invite',id:id,info:inf[0]};renderSheet();return;}}catch(e){}
    S.sheet=null;toast('Ese partido ya no está disponible',true);render();return;}
  renderSheet();poll=setInterval(function(){if(S.sheet&&S.sheet.type==='match'&&S.sheet.id===id)loadMatch(id).then(keepChat).catch(function(){});else stopPoll();},6000);}
function keepChat(){var inp=document.querySelector('[data-form="chat"] input'),val=inp?inp.value:'',foc=inp&&document.activeElement===inp;renderSheet();var n=document.querySelector('[data-form="chat"] input');if(n){n.value=val;if(foc)n.focus();}}

/* Ir a la página de pago de Stripe */
async function goPay(bookingId,kind){S.busy=true;renderSheet();render();
  try{var res=await fx('pago-crear',{booking_id:bookingId,kind:kind});
    if(res&&res.url){try{sessionStorage.setItem('revo-pago',bookingId);}catch(e){}window.location.href=res.url;return;}

  catch(e){S.busy=false;toast(errMsg(e),true);await refresh();openMatch(bookingId);}}
/* Cuenta atrás de los partidos abiertos (plazo de 4 horas para completarse) */
function limitDate(b){var lim=b.pay_deadline?new Date(b.pay_deadline):null;var two=startDate(b.day,b.start_min-120);if(!lim||two<lim)lim=two;return lim;}
function cdText(ms){if(ms<=0)return '0:00';var t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sg=t%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sg).padStart(2,'0');}
function cdHtml(b,big){if(!(b.is_open&&b.kind==='app'&&b.payment_state==='pending'))return '';var lim=limitDate(b);
  return big?'<div class="cdbox"><span>Se cancela si no se completa en</span><b class="cd" data-until="'+lim.toISOString()+'">'+cdText(lim-Date.now())+'</b></div>'
    :'<span class="tag cdtag">⏳ <span class="cd" data-until="'+lim.toISOString()+'">'+cdText(lim-Date.now())+'</span></span>';}
setInterval(function(){var els=document.querySelectorAll('.cd[data-until]');for(var i=0;i<els.length;i++){var ms=new Date(els[i].getAttribute('data-until'))-Date.now();els[i].textContent=cdText(ms);if(ms<600000)els[i].classList.add('urg');}},1000);
/* Hora límite para que paguen todos: la que llegue antes entre el plazo de la reserva y 2 horas antes del partido */
function limitText(b){var lim=null;
  if(b.pay_deadline)lim=new Date(b.pay_deadline);
  var two=startDate(b.day,b.start_min-120);if(!lim||two<lim)lim=two;
  var hhmm=new Intl.DateTimeFormat('es-ES',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(lim);
  var sameDay=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(lim)===nowM().day;
  return 'Tienen que pagar todos antes de las '+hhmm+(sameDay?'':' del '+dfmt(new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(lim),{weekday:'long',day:'numeric'}))+'. Si no, la pista se libera y se devuelve el dinero.';}
/* Fecha real (hora de España) del día y minuto dados */
function startDate(day,min){var guess=new Date(day+'T00:00:00Z');guess=new Date(guess.getTime()+min*60000);
  var p={};new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(guess).forEach(function(x){p[x.type]=x.value;});
  var shown=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);return new Date(guess.getTime()-(shown-guess.getTime()));}
function findBooking(id){var all=[].concat(S.match?[S.match]:[],S.panel||[],S.mine||[],S.open||[]);for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return null;}
function refundNote(pv,leave){
  if(!pv.confirmed)return 'Como la reserva aún no estaba confirmada, se devuelve la pista entera. Los '+euro(FEE)+' de gestión no se devuelven.';
  if(pv.pct===100)return 'Faltan más de 24 horas: se devuelve el 100 % de la pista.';
  if(pv.pct===75)return 'Faltan entre 24 y 6 horas: se devuelve el 75 % de la pista.';
  return 'Faltan menos de 6 horas: ya no hay devolución.'+(leave?'':' A los demás jugadores se les devuelve todo.');}

/* ===== Más movimiento ===== */
function motionOK(){return !(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function buzz(){try{if(motionOK()&&navigator.vibrate)navigator.vibrate(8);}catch(e){}}
// Onda al pulsar
document.addEventListener('pointerdown',function(ev){if(!motionOK())return;
  var b=ev.target.closest('.btn,button.slot,.day,.tabs button,button.card,.seg button');if(!b||b.disabled)return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');
  if(getComputedStyle(b).position==='static')b.style.position='relative';b.style.overflow='hidden';
  sp.className='rip';sp.style.width=sp.style.height=d+'px';sp.style.left=(ev.clientX-r.left-d/2)+'px';sp.style.top=(ev.clientY-r.top-d/2)+'px';
  b.appendChild(sp);setTimeout(function(){sp.remove();},600);
  if(b.matches('button.slot'))buzz();},{passive:true});
// Números que suben solos
var seenNums={};
function countUp(el,key){var txt=el.firstChild&&el.firstChild.nodeType===3?el.firstChild:null;if(!txt)return;
  var full=txt.nodeValue,m=full.match(/\d+(?:[.,]\d+)?/);if(!m){seenNums[key]=full;return;}
  if(seenNums[key]===full)return;var first=!(key in seenNums);seenNums[key]=full;if(!first&&!motionOK())return;
  if(!motionOK())return;var dec=(m[0].split(/[.,]/)[1]||'').length,sep=m[0].indexOf(',')>=0?',':'.',to=parseFloat(m[0].replace(',','.'));if(!to)return;
  var pre=full.slice(0,m.index),post=full.slice(m.index+m[0].length),t0=performance.now(),dur=750;
  (function step(now){var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),v=(to*e).toFixed(dec);if(sep===',')v=v.replace('.',',');
    if(!txt.isConnected)return;txt.nodeValue=pre+v+post;if(k<1)requestAnimationFrame(step);})(t0);}
function afterRender(anim){
  document.querySelectorAll('#app .kpi b,#app .cajagrid b').forEach(function(el,i){countUp(el,S.tab+'|'+i);});
  var on=document.querySelector('#app .day.on');
  if(on&&anim){if(S.picked&&motionOK())on.classList.add('picked');
    var row=on.parentNode;if(row&&row.scrollWidth>row.clientWidth){var x=on.offsetLeft-row.clientWidth/2+on.offsetWidth/2;try{row.scrollTo({left:x,behavior:motionOK()?'smooth':'auto'});}catch(e){row.scrollLeft=x;}}}
  if(anim)S.picked=false;}
// Deslizar hacia abajo para cerrar la ventana (móvil)
(function(){var st=null;
  document.addEventListener('touchstart',function(ev){var sh=ev.target.closest('.sheet');if(!sh||window.innerWidth>=900||ev.target.closest('input,select,textarea'))return;
    if(sh.scrollTop>0)return;st={sh:sh,y:ev.touches[0].clientY,dy:0};sh.style.transition='none';},{passive:true});
  document.addEventListener('touchmove',function(ev){if(!st)return;st.dy=Math.max(0,ev.touches[0].clientY-st.y);
    if(st.sh.scrollTop>0){st.dy=0;}st.sh.style.transform=st.dy?'translateY('+st.dy+'px)':'';},{passive:true});
  document.addEventListener('touchend',function(){if(!st)return;var s=st;st=null;
    if(s.dy>110&&S.sheet){s.sh.style.transition='transform .2s ease';s.sh.style.transform='translateY(100%)';S.sheet=null;stopPoll();
      setTimeout(function(){var el=document.getElementById('sheet');if(!S.sheet)el.innerHTML='';},200);lastSheet=null;}
    else{s.sh.style.transition='transform .25s cubic-bezier(.2,.85,.25,1)';s.sh.style.transform='';}},{passive:true});})();

/* ===== Test de nivel la primera vez ===== */
var QBALL='<svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#D4F04A"/><path d="M4.5 5.5c3.5 3 3.5 10 0 13M19.5 5.5c-3.5 3-3.5 10 0 13" fill="none" stroke="#0A0F05" stroke-width="1.6" stroke-linecap="round"/></svg>';
function markLevelSet(){try{sb.auth.updateUser({data:{level_set:true}}).catch(function(){});}catch(e){}
  if(S.user){S.user.user_metadata=Object.assign({},S.user.user_metadata,{level_set:true});}}
function maybeLevelQuiz(){if(!S.user||!S.me||S.sheet||S.loading)return;var md=S.user.user_metadata||{};if(md.level_set)return;
  S.sheet={type:'quizIntro'};renderSheet();}

/* ===== Arranque ===== */
var curUid;
async function setUser(u){var uid=(u&&u.id)||null;
  if(uid===curUid){if(u)S.user=u;return;}
  curUid=uid;S.user=u||null;
  S.club=null;S.sheet=null;stopPoll();
  if(!S.user){S.loading=false;render();return;}
  S.loading=true;render();
  try{await loadBase();await loadTab();}catch(e){if(curUid===uid)toast(errMsg(e),true);}
  refreshPush();
  if(curUid!==uid)return;
  S.loading=false;render();
  var m=/^#p=([0-9a-f-]{36})$/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname);openMatch(m[1]);}
  var sp=new URLSearchParams(location.search),pg=sp.get('pago'),pb=sp.get('b'),stv=sp.get('stripe');
  /* Enlaces desde la web: ?d=AAAA-MM-DD&h=minutos abre esa hora para reservar; ?tab=partidos abre los partidos */
  var dl=sp.get('d'),dh=sp.get('h'),dt=sp.get('tab');
  if((dl&&/^\d{4}-\d{2}-\d{2}$/.test(dl))||dt){history.replaceState(null,'',location.pathname);
    if(dt&&['partidos','mias','perfil','reservar'].indexOf(dt)>=0&&!dl){S.tab=dt;render();await refresh();}
    else if(dl&&dl>=nowM().day&&dl<=addDays(nowM().day,14)){S.tab='reservar';S.day=dl;await refresh();
      var hm0=parseInt(dh,10);
      if(!isNaN(hm0)&&!isPast(dl,hm0)){var taken={};S.occ.forEach(function(o){taken[o.court_id+'|'+o.start_min]=1;});
        var freeC=S.courts.filter(function(c){return !taken[c.id+'|'+hm0];})[0];
        if(freeC){S.sheet={type:'book',court:freeC.id,start:hm0,open:false};renderSheet();}
        else toast('Esa hora ya se ha reservado. Elige otra.',true);}}}
  if(pg&&/^[0-9a-f-]{36}$/.test(pb||'')){history.replaceState(null,'',location.pathname);
    if(pg==='ok'){toast('Pago recibido. Lo estamos confirmando…');openMatch(pb);
      var tries=0;(async function chk(){tries++;var r=null;try{r=await fx('pago-verificar',{booking_id:pb});}catch(e){}
        var done=r&&r.resultados&&r.resultados.some(function(x){return x==='pagado'||x==='ya_procesado'||x==='devuelto';});
        if(done||tries>=4){await refresh();if(S.sheet&&S.sheet.id===pb)loadMatch(pb).then(keepChat).catch(function(){});
          if(r&&r.estado_pago==='confirmed'){toast('¡Pagado! Reserva confirmada');celebrate();}else if(done){toast('Pagado. Falta que paguen los demás');celebrate();}}
        else setTimeout(chk,2000);})();}
    else releaseUnpaid(pb);}
  if(S.reopenPay&&!pg){var rp=S.reopenPay;S.reopenPay=null;releaseUnpaid(rp);}
  if(!pg&&!stv)setTimeout(maybeLevelQuiz,700);
  if(stv){history.replaceState(null,'',location.pathname);if(S.admin){S.tab='club';render();refresh();toast(stv==='vuelta'?'Volviste de Stripe: comprobando la cuenta del club…':'El enlace caducó, vuelve a pulsar «Conectar cobros»');}}}
async function start(){
  try{var r=await sb.auth.getSession();await setUser(r.data.session&&r.data.session.user);}
  catch(e){S.loading=false;toast(errMsg(e),true);render();}}
sb.auth.onAuthStateChange(function(ev,session){var u=session&&session.user;setTimeout(function(){setUser(u);},0);});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.user&&S.club)refresh();});
/* Si sales del pago sin pagar, la hora se libera al momento (o te sales del partido si te estabas apuntando) */
async function releaseUnpaid(id){S.busy=false;S.sheet=null;stopPoll();render();
  try{var v=null;try{v=await fx('pago-verificar',{booking_id:id});}catch(e){}
    if(v&&v.resultados&&v.resultados.indexOf('pagado')>=0){toast('¡Pago recibido!');await refresh();openMatch(id);return;}
    var b=await q(sb.from('bookings').select(SEL).eq('id',id).maybeSingle());
    var me=b&&myRow(b);
    if(b&&b.status==='active'&&b.payment_state==='pending'&&me&&!me.paid_at){
      if(b.owner_id===S.user.id){if(paidCount(b)===0){await fx('pago-cancelar',{booking_id:id,action:'cancel'});toast('Has salido sin pagar: la hora vuelve a estar libre');}
        else{toast('No has terminado el pago');openMatch(id);}}
      else{await fx('pago-cancelar',{booking_id:id,action:'leave'});toast('Has salido sin pagar: no te has apuntado');}}}
  catch(e){toast(errMsg(e),true);}
  await refresh();}
/* Al volver atrás desde Stripe el navegador restaura la página tal cual (con «Un momento…»): se desbloquea y se abre la reserva para pagar o cancelar */
window.addEventListener('pageshow',function(e){var pb=null;try{pb=sessionStorage.getItem('revo-pago');sessionStorage.removeItem('revo-pago');}catch(_){}
  if(!e.persisted&&!pb)return;S.busy=false;
  if(S.user&&S.club){if(pb&&!/[?&]pago=/.test(location.search))releaseUnpaid(pb);else refresh();}
  else{if(pb&&!/[?&]pago=/.test(location.search))S.reopenPay=pb;render();}});
window.addEventListener('hashchange',function(){var m=/^#p=([0-9a-f-]{36})$/.exec(location.hash);if(m&&S.user&&S.club){history.replaceState(null,'',location.pathname);openMatch(m[1]);}});
/* Aviso para instalar la app (Android: botón; iPhone: pasos de Safari) */
var deferredInstall=null,instHidden=false;
try{instHidden=localStorage.getItem('revo-inst-off')==='1';}catch(e){}
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function isIOS(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function renderInst(){var el=document.getElementById('inst');var asked=/[?&]instalar=1/.test(location.search);
  if(standalone()||(instHidden&&!asked)||(!deferredInstall&&!isIOS()&&!asked)){el.innerHTML='';return;}
  var solo=document.getElementById('tabs').hidden;
  var body=deferredInstall?'<p><b>Instala Revo en tu móvil</b>Tendrás la app en tu pantalla de inicio.</p><button class="btn" data-inst="go">Instalar</button>'
    :isIOS()?'<p><b>Instala Revo en tu iPhone</b>En Safari, toca compartir <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> y luego «Añadir a pantalla de inicio».</p>'
    :'<p><b>Instala Revo en tu móvil</b>Abre el menú ⋮ del navegador y elige «Instalar aplicación».</p>';
  el.innerHTML='<div class="inst'+(solo?' solo':'')+'" role="region" aria-label="Instalar la app">'+body+'<button class="x" data-inst="off" aria-label="Cerrar aviso">×</button></div>';}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;renderInst();});
window.addEventListener('appinstalled',function(){deferredInstall=null;renderInst();});
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-inst]');if(!b)return;
  if(b.dataset.inst==='go'&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;renderInst();});}
  if(b.dataset.inst==='off'){instHidden=true;try{localStorage.setItem('revo-inst-off','1');}catch(e){}if(/[?&]instalar=1/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);renderInst();}});
var _render=render;render=function(anim){_render(anim);renderInst();};
start();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});}
